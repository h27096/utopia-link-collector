name: Collect Utopia links

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: utopia-link-collection
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out latest main branch
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test collector
        run: python -m unittest -v
      - name: Scan public sources
        id: scan
        timeout-minutes: 45
        run: python -u collector.py
      - name: Save newly collected links
        if: ${{ always() && !cancelled() && steps.scan.outcome != 'skipped' }}
        shell: bash
        run: |
          git add -- links.txt
          if git diff --cached --quiet; then
            echo "No new links to save."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Append newly verified Utopia links"
          # Never force-push or overwrite concurrent edits. If main changed,
          # this push fails visibly; the next scan can rediscover those links.
          git push origin HEAD:main
      - name: Install optional Google Docs dependencies
        if: ${{ always() && !cancelled() && steps.scan.outcome != 'skipped' }}
        run: python -m pip install -r requirements-docs.txt
      - name: Append saved links to Google Docs
        if: ${{ always() && !cancelled() && steps.scan.outcome != 'skipped' }}
        timeout-minutes: 5
        env:
          GOOGLE_DOC_ID: ${{ vars.GOOGLE_DOC_ID }}
          GOOGLE_DOC_TAB_ID: ${{ vars.GOOGLE_DOC_TAB_ID }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: python -u sync_docs.py --if-configured
